<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Scoopian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&family=Noto+Serif+Sinhala:wght@700;800&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#FFF5EC;--surface:#fff;--ink:#111;--muted:#5E5650;--teal:#C24E00;--on-teal:#fff;--sun:#FF7A00;--line:#F0D9C6;--hero:#0A0A0A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0A;--surface:#1A1A1A;--ink:#F7F1EA;--muted:#B5AAA0;--teal:#FF8A1F;--on-teal:#0A0A0A;--line:#333}}
:root[data-theme="dark"]{--bg:#0A0A0A;--surface:#1A1A1A;--ink:#F7F1EA;--muted:#B5AAA0;--teal:#FF8A1F;--on-teal:#0A0A0A;--line:#333}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Sinhala",system-ui,sans-serif;line-height:1.75;padding-bottom:90px}
h1,h2{font-family:"Noto Serif Sinhala",Georgia,serif;line-height:1.35;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden;padding:28px 0 64px;border-bottom:5px solid var(--sun)}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:var(--sun)}
.hero .wrap{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.rt{display:flex;gap:10px;align-items:center}
.brand{font-weight:800;font-size:1.1rem}
.lang{display:flex;border:2px solid var(--sun);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;font:600 .95rem "Noto Sans Sinhala",system-ui,sans-serif;padding:6px 16px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sun);color:#0A0A0A}
.hero h1{font-size:clamp(2rem,7vw,3.4rem);max-width:15ch}
.hero p{max-width:34ch;margin:18px 0 28px;font-size:1.05rem;opacity:.92}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 26px;font:600 1rem "Noto Sans Sinhala",system-ui,sans-serif;cursor:pointer;text-decoration:none;background:var(--sun);color:#0A0A0A}
.adm{background:#fff;padding:6px 14px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,.q button:focus-visible,.lang button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
section{padding:44px 0}
h2{font-size:1.6rem;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.pic{aspect-ratio:4/3;width:100%;border-radius:10px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-size:3rem}
.item b{font-size:1.05rem}
.price{color:var(--teal);font-weight:800}
.q{display:flex;align-items:center;gap:12px;margin-top:8px}
.q button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.3rem;cursor:pointer}
.q span{min-width:1.5ch;text-align:center;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface);border-left:5px solid var(--sun);border-radius:10px;padding:12px 16px}
.steps li::before{content:counter(s)". ";font-weight:800;color:var(--teal)}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;max-width:560px}
label{display:grid;gap:4px;font-weight:600}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.sum{margin:0 0 4px;padding:0;list-style:none}
.sum li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:4px 0}
.tot{font-weight:800;display:flex;justify-content:space-between;font-size:1.1rem}
.err{color:#C0392B;font-weight:600;min-height:1.5em;margin:0}
.send{background:var(--teal);color:var(--on-teal);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0A0A0A;color:#fff;border-top:3px solid var(--sun);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.bar .btn{padding:8px 20px}
footer{text-align:center;color:var(--muted);padding:20px 20px 30px}
dialog{width:calc(100% - 24px);max-width:640px;border:0;border-radius:14px;padding:18px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.65)}
.row{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.th{width:96px;height:72px;object-fit:cover;border-radius:8px;background:var(--bg)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<dialog id="dlg"><h2>භාණ්ඩ කළමනාකරණය</h2><p class="sub">නම, මිල සහ ඡායාරූප වෙනස් කර "සුරකින්න" ඔබන්න. වෙනස්කම් සියලු දෙනාට පෙනේ.</p><div id="rows"></div><p class="err" id="aerr" role="alert"></p><div class="acts"><button type="button" class="btn ghost" id="add">+ භාණ්ඩයක් එකතු කරන්න</button><button type="button" class="btn" id="save">සුරකින්න සහ ප්‍රකාශයට පත් කරන්න</button><button type="button" class="btn ghost" id="cls">වසන්න</button></div></dialog>`;
document.getElementById("root").innerHTML=SHELL;
var P=JSON.parse(document.getElementById("data").textContent).products;
var Q={},L="si",E=[],A=null,AS=null;
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function nm(x){return x[L]||x.si||""}
function fmt(x){return T[L].cur+Number(x).toLocaleString("en-US")}
function draw(){
 var t=T[L];
 document.getElementById("grid").innerHTML=P.map(function(x,k){
  var q=Q[x.id]||0;
  return '<div class="item">'+(x.img?'<img class="pic" src="'+esc(x.img)+'" alt="'+esc(nm(x))+'" loading="lazy">':'<div class="pic">'+esc(x.e||"🛍️")+'</div>')+'<b>'+esc(nm(x))+'</b><span class="price">'+fmt(x.p)+'</span><div class="q"><button type="button" aria-label="'+t.less+'" data-k="'+k+'" data-d="-1">−</button><span>'+q+'</span><button type="button" aria-label="'+t.more+'" data-k="'+k+'" data-d="1">+</button></div></div>';
 }).join("");
 var c=0,s=0,h="";
 P.forEach(function(x){var q=Q[x.id]||0;if(q){c+=q;s+=q*x.p;h+='<li><span>'+esc(nm(x))+' × '+q+'</span><span>'+fmt(q*x.p)+'</span></li>'}});
 document.getElementById("sum").innerHTML=h||'<li>'+t.empty+'</li>';
 document.getElementById("tot").textContent=fmt(s);
 document.getElementById("cnt").textContent=t.cnt+c+" · "+fmt(s);
 return s;
}
function setLang(l){
 L=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[l][e.dataset.t]});
 document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l?"true":"false")});
 document.getElementById("err").textContent="";
 try{localStorage.setItem("lang",l)}catch(e){}
 draw();
}
document.querySelector(".lang").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.l)});
document.getElementById("grid").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var x=P[+b.dataset.k];Q[x.id]=Math.max(0,(Q[x.id]||0)+(+b.dataset.d));draw();
});
document.getElementById("go").addEventListener("click",function(e){
 var t=T[L],s=draw(),n=document.getElementById("n").value.trim(),p=document.getElementById("p").value.trim(),a=document.getElementById("a").value.trim(),er=document.getElementById("err");
 if(!s){e.preventDefault();er.textContent=t.e1;return}
 if(!n||!p||!a){e.preventDefault();er.textContent=t.e2;return}
 er.textContent="";
 var m="*The Scoopian – "+t.mh+"*\n\n";
 P.forEach(function(x){var q=Q[x.id]||0;if(q)m+="• "+nm(x)+" × "+q+" = "+fmt(q*x.p)+"\n"});
 m+="\n*"+t.mt+":* "+fmt(s)+"\n\n*"+t.mn+":* "+n+"\n*"+t.mp+":* "+p+"\n*"+t.ma+":* "+a;
 this.href="https://wa.me/"+WA+"?text="+encodeURIComponent(m);
});
/* ---- owner editing ---- */
function rows(){
 document.getElementById("rows").innerHTML=E.map(function(x,k){
  return '<div class="row"><label>නම (සිංහල)<input data-k="'+k+'" data-f="si" value="'+esc(x.si)+'"></label><label>Name (English)<input data-k="'+k+'" data-f="en" value="'+esc(x.en)+'"></label><label>මිල (රු.)<input type="number" min="0" inputmode="decimal" data-k="'+k+'" data-f="p" value="'+esc(x.p)+'"></label><label>ඡායාරූපය<input type="file" accept="image/*" data-k="'+k+'" data-f="file"></label>'+(x.img?'<img class="th" src="'+esc(x.img)+'" alt="">':'')+'<div class="acts"><button type="button" class="btn ghost" data-k="'+k+'" data-del="1">ඉවත් කරන්න</button></div></div>';
 }).join("");
}
function shrink(f){return new Promise(function(ok,no){var i=new Image(),u=URL.createObjectURL(f);i.onload=function(){var r=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*r;c.height=i.height*r;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.85)};i.onerror=no;i.src=u})}
function build(prod){
 var css=document.getElementById("css").textContent,js=document.getElementById("app").textContent;
 return '<!DOCTYPE html>\n<html lang="si">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>The Scoopian</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&family=Noto+Serif+Sinhala:wght@700;800&display=swap" rel="stylesheet">\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="data">'+JSON.stringify({products:prod}).replace(/</g,"\\u003c")+'<\/script>\n<script id="app">'+js+'<\/script>\n</body>\n</html>';
}
(async function(){
 try{
  if(!window.claude)return;
  var u=await claude.use("user");
  if(!u||!(u.isOwner()||u.canEdit()))return;
  A=await claude.use("artifact");AS=await claude.use("assets");
  if(!A)return;
  var d=document.getElementById("dlg"),er=document.getElementById("aerr"),ab=document.getElementById("adm");
  ab.hidden=false;
  ab.onclick=function(){E=JSON.parse(JSON.stringify(P));er.textContent="";rows();d.showModal()};
  document.getElementById("cls").onclick=function(){d.close()};
  document.getElementById("add").onclick=function(){E.push({id:"p"+Date.now(),si:"",en:"",p:0,img:"",e:"🛍️"});rows()};
  document.getElementById("rows").addEventListener("input",function(e){
   var t=e.target,x=E[+t.dataset.k];if(!x||!t.dataset.f||t.dataset.f==="file")return;
   x[t.dataset.f]=t.dataset.f==="p"?Number(t.value)||0:t.value;
  });
  document.getElementById("rows").addEventListener("change",async function(e){
   var t=e.target,x=E[+t.dataset.k];if(!x||t.dataset.f!=="file"||!t.files[0])return;
   if(!AS){er.textContent="ඡායාරූප උඩුගත කිරීමට ඔබට අවසර නැත.";return}
   er.textContent="උඩුගත වෙමින්…";
   try{var b=await shrink(t.files[0]).catch(function(){return t.files[0]});var r=await AS.upload(b);x.img=r.url;er.textContent="";rows()}catch(x2){er.textContent="ඡායාරූපය උඩුගත කිරීම අසාර්ථකයි."}
  });
  document.getElementById("rows").addEventListener("click",function(e){
   var b=e.target.closest("button[data-del]");if(!b)return;
   E.splice(+b.dataset.k,1);rows();
  });
  document.getElementById("save").onclick=async function(){
   var ok=E.filter(function(x){return (x.si||x.en||"").trim()});
   er.textContent="සුරකිමින්…";
   try{await A.publish(build(ok))}catch(x){er.textContent="සුරැකීම අසාර්ථකයි. නැවත උත්සාහ කරන්න."}
  };
 }catch(x){}
})();
var saved="si";try{saved=localStorage.getItem("lang")||"si"}catch(e){}
setLang(saved==="en"?"en":"si");
</script>
